<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEFCD"/>
      <stop offset="0.62" stop-color="#B3DAA2"/>
      <stop offset="1" stop-color="#86BF77"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.2" r="0.35">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FBE3D2"/>
      <stop offset="1" stop-color="#EFC5AC"/>
    </radialGradient>
    <radialGradient id="wool" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF5E8"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="cloud">
      <circle cx="512" cy="540" r="262"/>
      <circle cx="762" cy="540" r="118"/>
      <circle cx="728" cy="415" r="118"/>
      <circle cx="637" cy="324" r="118"/>
      <circle cx="512" cy="290" r="118"/>
      <circle cx="387" cy="324" r="118"/>
      <circle cx="296" cy="415" r="118"/>
      <circle cx="262" cy="540" r="118"/>
      <circle cx="296" cy="665" r="118"/>
      <circle cx="387" cy="756" r="118"/>
      <circle cx="512" cy="790" r="118"/>
      <circle cx="637" cy="756" r="118"/>
      <circle cx="728" cy="665" r="118"/>
    </g>
  </defs>

  <!-- meadow background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sun)"/>
  <ellipse cx="512" cy="1120" rx="760" ry="250" fill="#8DC07D" opacity="0.55"/>

  <!-- ground shadow -->
  <ellipse cx="520" cy="905" rx="300" ry="42" fill="#4E7A45" opacity="0.28" filter="url(#soft)"/>

  <!-- wool: shade layer, then body -->
  <use href="#cloud" fill="#E7DCC6" transform="translate(6,22)"/>
  <use href="#cloud" fill="url(#wool)"/>
  <!-- wool curl highlights -->
  <g fill="none" stroke="#EFE6D3" stroke-width="14" stroke-linecap="round">
    <path d="M232 600 q22 -30 50 -8"/>
    <path d="M745 470 q28 -22 46 8"/>
    <path d="M470 832 q24 -26 52 -4"/>
    <path d="M640 790 q24 -24 48 0"/>
    <path d="M300 410 q20 -28 48 -10"/>
  </g>

  <!-- ears -->
  <g>
    <ellipse cx="318" cy="528" rx="92" ry="44" fill="#EBBFA5" transform="rotate(-22 318 528)"/>
    <ellipse cx="324" cy="530" rx="58" ry="22" fill="#F4A9A3" opacity="0.85" transform="rotate(-22 324 530)"/>
    <ellipse cx="706" cy="528" rx="92" ry="44" fill="#EBBFA5" transform="rotate(22 706 528)"/>
    <ellipse cx="700" cy="530" rx="58" ry="22" fill="#F4A9A3" opacity="0.85" transform="rotate(22 700 530)"/>
  </g>

  <!-- face -->
  <ellipse cx="512" cy="588" rx="168" ry="182" fill="#D8A88F" opacity="0.5" transform="translate(4,12)"/>
  <ellipse cx="512" cy="588" rx="168" ry="182" fill="url(#face)"/>

  <!-- forehead tuft -->
  <g>
    <g fill="#E7DCC6" transform="translate(4,14)">
      <circle cx="430" cy="430" r="68"/><circle cx="512" cy="404" r="80"/><circle cx="594" cy="430" r="68"/>
    </g>
    <g fill="url(#wool)">
      <circle cx="430" cy="430" r="68"/><circle cx="512" cy="404" r="80"/><circle cx="594" cy="430" r="68"/>
    </g>
    <path d="M488 392 q22 -26 48 -2" fill="none" stroke="#EFE6D3" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- eyes -->
  <g>
    <ellipse cx="452" cy="596" rx="27" ry="31" fill="#3A2E2A"/>
    <ellipse cx="572" cy="596" rx="27" ry="31" fill="#3A2E2A"/>
    <circle cx="442" cy="584" r="10" fill="#FFFFFF"/>
    <circle cx="562" cy="584" r="10" fill="#FFFFFF"/>
    <circle cx="461" cy="609" r="4.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="581" cy="609" r="4.5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- cheeks -->
  <ellipse cx="410" cy="660" rx="38" ry="22" fill="#F49A93" opacity="0.6" filter="url(#tiny)"/>
  <ellipse cx="614" cy="660" rx="38" ry="22" fill="#F49A93" opacity="0.6" filter="url(#tiny)"/>

  <!-- nose + mouth -->
  <path d="M496 650 q16 -8 32 0 q-4 16 -16 20 q-12 -4 -16 -20z" fill="#C88271"/>
  <path d="M512 670 v10 M486 684 q13 14 26 0 q13 14 26 0" fill="none" stroke="#9E6455" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sprout on head -->
  <g>
    <path d="M512 182 C512 150 514 126 520 102" fill="none" stroke="#4F8F4A" stroke-width="14" stroke-linecap="round"/>
    <path d="M518 112 C548 70 604 62 632 86 C606 124 556 134 518 112z" fill="#6DB062"/>
    <path d="M522 110 C560 96 590 90 616 88" fill="none" stroke="#A9D99A" stroke-width="7" stroke-linecap="round"/>
    <path d="M514 128 C484 92 434 90 410 112 C436 146 484 150 514 128z" fill="#5BA052"/>
    <path d="M508 126 C478 116 452 112 426 113" fill="none" stroke="#98CC88" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
